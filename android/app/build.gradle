apply plugin: 'com.android.application'

// Release signing — two sources, checked in this order, neither ever committed:
//   1. android/keystore.properties (gitignored) — for a developer who has the
//      real .jks on their own machine and wants a local signed build.
//   2. ANDROID_KEYSTORE_PATH / _PASSWORD / ANDROID_KEY_ALIAS / _PASSWORD env
//      vars — what CI uses: android.yml decodes the ANDROID_KEYSTORE_BASE64
//      GitHub secret to a runner-local temp file and exports these before
//      calling bundleRelease.
// If neither is present (e.g. a PR from a fork, or this file's own env
// before secrets are configured), buildTypes.release below just has no
// signingConfig — bundleRelease still produces an unsigned AAB, which is
// enough to verify the release build itself compiles even before a signing
// identity exists.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
// GitHub Actions sets an `env:` var to an empty string when the underlying
// secret doesn't exist rather than omitting it — System.getenv would return
// "" (non-null) in that case, so this checks for non-blank, not just non-null.
def envKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def hasEnvSigning = envKeystorePath?.trim() &&
    System.getenv("ANDROID_KEYSTORE_PASSWORD")?.trim() &&
    System.getenv("ANDROID_KEY_ALIAS")?.trim() &&
    System.getenv("ANDROID_KEY_PASSWORD")?.trim()
def hasReleaseSigning = hasKeystoreProperties || hasEnvSigning

android {
    namespace = "fr.ittsui.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fr.ittsui.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(hasKeystoreProperties ? keystoreProperties['storeFile'] : envKeystorePath)
                storePassword hasKeystoreProperties ? keystoreProperties['storePassword'] : System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias hasKeystoreProperties ? keystoreProperties['keyAlias'] : System.getenv("ANDROID_KEY_ALIAS")
                keyPassword hasKeystoreProperties ? keystoreProperties['keyPassword'] : System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
