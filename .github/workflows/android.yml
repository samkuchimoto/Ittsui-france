name: Android build

# Builds a debug APK on every push to main. This wraps the live deployed
# site (capacitor.config.ts uses server.url, not a bundled local build —
# see that file's comment) — `npm run build` here is a compile/type-check
# gate on the web app, not what actually ships inside the APK, and the
# workflow doesn't need Firebase secrets configured for that reason.
#
# google-services.json is not present in this repo (see android/app/
# build.gradle's own try/catch around the google-services plugin) — the
# build below succeeds without it, but push notifications won't be live
# on Android until that file is added from the Firebase console.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      # Secrets can't be referenced directly in `if:` conditions — this
      # passthrough is the documented safe pattern. When ANDROID_KEYSTORE_BASE64
      # isn't set (no signing key configured yet, or a fork PR that doesn't
      # get repo secrets), HAS_SIGNING is the literal string "false" and every
      # signing-dependent step below is skipped; bundleRelease still runs and
      # still produces an AAB, just unsigned — see android/app/build.gradle's
      # comment on the same fallback.
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Capacitor 8.5's generated android/app/capacitor.build.gradle sets
      # sourceCompatibility/targetCompatibility to VERSION_21 — a JDK 17
      # toolchain can't compile to that target, which is what was failing
      # the "Build debug APK" step (exit code 1, no further detail visible
      # without a log-download token) even after cap sync/copy/update
      # started succeeding on Node 22.
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      # Informational only — never fails the job. Prints environment/plugin
      # diagnostics to the visible step log, which is otherwise the only
      # extra signal available here (job logs for this repo aren't
      # downloadable without admin access, and an earlier attempt to
      # capture output to a file instead of letting it print directly
      # just hid it from this log viewer too — reverted).
      - name: Capacitor environment diagnostics
        run: npx cap doctor android
        continue-on-error: true

      # Split into copy + update (what "sync" is anyway, combined) so a
      # failure's exact phase is visible from the step list alone, without
      # needing to parse output. CI=false because some npm CLIs change
      # behavior (fail instead of proceeding past something that's only a
      # warning locally) when they detect a CI environment — GitHub Actions
      # sets CI=true by default; this unsets it for just these two steps.
      - name: Copy web assets into Android shell
        run: npx cap copy android
        env:
          # NOT `false` — env vars are always strings, and the string
          # "false" is truthy in JS, so `CI: false` here would have been a
          # no-op for any tool doing a naive `if (process.env.CI)` check.
          # An empty string is the correct falsy value.
          CI: ""

      - name: Update Android native dependencies
        run: npx cap update android
        env:
          # NOT `false` — env vars are always strings, and the string
          # "false" is truthy in JS, so `CI: false` here would have been a
          # no-op for any tool doing a naive `if (process.env.CI)` check.
          # An empty string is the correct falsy value.
          CI: ""

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ittsui-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Decodes the keystore to a runner-local temp file that only exists for
      # this job run — never written to the repo, never echoed to a log line.
      # The path itself (not its contents) is passed to build.gradle via
      # ANDROID_KEYSTORE_PATH.
      - name: Decode release keystore
        if: env.HAS_SIGNING == 'true'
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ittsui-release.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.HAS_SIGNING == 'true' && format('{0}/ittsui-release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Remove decoded keystore
        if: always() && env.HAS_SIGNING == 'true'
        run: rm -f "$RUNNER_TEMP/ittsui-release.jks"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HAS_SIGNING == 'true' && 'ittsui-release-aab-signed' || 'ittsui-release-aab-UNSIGNED' }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
